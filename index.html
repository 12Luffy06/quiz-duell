<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Max' Quiz-Duell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800;1,900&family=JetBrains+Mono:wght@600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
/* Layout: Quizshow-Studio im Jeopardy-Stil. Host: HUD oben, Brett in der Mitte, Teams unten, Frage als Overlay. Spieler: eine Spalte mit großem Buzzer. Bewusst nur ein dunkles Design. */
:root{
  color-scheme:dark;
  --night:#070b1f;
  --grid:rgba(90,120,220,.07);
  --tile:#17306e; --tile-hi:#2149a0; --tile-edge:#2f5bc4;
  --cat:#8f1c3c; --cat-edge:#d0325f;
  --ink:#eef2ff; --ink-dim:#93a1d6;
  --panel:rgba(12,20,48,.85); --line:#23347a;
  --bolt:#e8344e; --gold:#f5c542;
  --good:#2fbf71; --bad:#e5484d;
  --t0:#e5484d; --t1:#3e8cf0; --t2:#2fbf71; --t3:#f5c542;
  --f-display:"Barlow Condensed","Arial Narrow","Impact",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),radial-gradient(ellipse 80% 60% at 50% 30%,#13245a 0%,transparent 70%);
  background-size:40px 40px,40px 40px,100% 100%;background-attachment:fixed}
.wrap{max-width:1280px;margin:0 auto;padding-block:16px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--night);border:1px solid #2a3a78;border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{font-family:var(--f-mono);font-size:12px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-dim);min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{margin:0;font-size:13px;color:var(--ink-dim)}

.logo{display:inline-flex;align-items:center;font-family:var(--f-display);font-style:italic;font-weight:900;text-transform:uppercase;line-height:.82;user-select:none}
.logo .w{display:flex;flex-direction:column;font-size:clamp(26px,3.6vw,40px);color:#dfe6ff;text-shadow:0 2px 0 #0a1440,0 0 18px rgba(80,120,255,.35)}
.logo .w span:last-child{padding-left:.55em}
.logo svg{width:clamp(22px,2.8vw,32px);height:auto;margin-left:4px;color:var(--bolt);filter:drop-shadow(0 0 10px rgba(232,52,78,.6))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:rgba(12,20,48,.8);padding:4px;border-radius:999px;border:1px solid var(--line);flex-wrap:wrap}
.tabs button{padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-dim);font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.tabs button[aria-pressed="true"]{background:var(--tile-edge);color:#fff}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
.live i{width:8px;height:8px;border-radius:50%;background:#5b6491}
.live.on i{background:var(--good);box-shadow:0 0 8px var(--good)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:700;background:#14214d;border:1px solid #2a3a78;font-family:var(--f-display);letter-spacing:.05em;text-transform:uppercase;font-size:15px}
.btn:hover{border-color:var(--ink-dim)}
.btn.primary{background:linear-gradient(180deg,#3a6ae0,#2149a0);border-color:#5a86f0;color:#fff;box-shadow:0 4px 0 #0f2a6a}
.btn.good{background:var(--good);border-color:var(--good);color:#04210f}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:#ff9aa8}
.btn:disabled{opacity:.4;cursor:not-allowed}
kbd{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid #2a3a78;color:var(--ink-dim)}

.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase}

/* Vorbereiten */
.setup{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.setup{grid-template-columns:minmax(0,1fr)}}
.team-edit{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;border:2px solid;background:rgba(0,0,0,.2)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.check input{width:auto}
.board-edit{overflow-x:auto}
.be-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(140px,1fr));gap:8px;min-width:min-content}
.be-cat input{background:var(--cat);border-color:var(--cat-edge);font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:center}
.be-cell{background:var(--tile);border:1px solid var(--tile-edge);border-radius:8px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:72px;min-width:0}
.be-cell:hover{background:var(--tile-hi)}
.be-cell b{font-family:var(--f-display);font-size:16px;color:var(--gold)}
.be-cell span{font-size:12px;color:#c9d4ff;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.be-cell.empty span{color:#ff9aa8}
.editor{border:1px dashed var(--gold);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:rgba(245,197,66,.04)}
.editor h3{margin:0;font-family:var(--f-display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.share{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:rgba(62,140,240,.08);font-size:14px}
.share b{color:#fff}

/* Host-Spiel */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.hud .l{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hud .r{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:760px){.hud{grid-template-columns:1fr}.hud .l,.hud .r{justify-content:center}.hud>div:nth-child(2){text-align:center}}
.round{font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:999px;border:1px solid var(--gold);color:var(--gold)}
.clock{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:3px solid #2a3a78;font-family:var(--f-mono);font-weight:700;font-size:20px;background:rgba(7,11,31,.8);position:relative;flex:none}
.clock svg{position:absolute;inset:-3px;width:calc(100% + 6px);height:calc(100% + 6px);transform:rotate(-90deg)}
.clock circle{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.clock.low circle{stroke:var(--bad)}.clock.low{color:var(--bad)}
.turn{display:inline-flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;border-radius:999px;font-family:var(--f-display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:16px;border:2px solid;background:rgba(7,11,31,.7)}
.turn i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 12px currentColor}
.board-scroll{overflow-x:auto;padding-bottom:4px}
.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:clamp(5px,.8vw,10px);min-width:620px}
.cat{background:linear-gradient(180deg,#a3224a,var(--cat));border:1px solid var(--cat-edge);border-radius:10px;min-height:54px;display:grid;place-items:center;text-align:center;padding:6px 8px;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:clamp(12px,1.25vw,16px);line-height:1.05;overflow-wrap:break-word;hyphens:auto;text-wrap:balance}
.tile{position:relative;min-height:clamp(54px,8vw,82px);border-radius:10px;background:linear-gradient(180deg,var(--tile-hi),var(--tile));border:1px solid var(--tile-edge);font-family:var(--f-display);font-style:italic;font-weight:800;font-size:clamp(22px,2.8vw,36px);color:#dfe8ff;text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s,filter .15s;font-variant-numeric:tabular-nums}
.tile:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 0 2px var(--gold),0 8px 20px rgba(0,0,0,.4);filter:brightness(1.15)}
.tile:disabled{cursor:default;background:rgba(23,48,110,.18);border-color:rgba(47,91,196,.22);color:transparent;text-shadow:none}
.tile .won{position:absolute;inset:auto 0 6px;display:flex;justify-content:center}
.tile .won i{width:10px;height:10px;border-radius:50%}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.team{position:relative;border:3px solid;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.25));padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;transition:transform .2s,box-shadow .2s;min-width:0}
.team.active{box-shadow:0 0 0 3px rgba(255,255,255,.12),0 0 24px var(--tc)}
.team .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.team .tname{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere;text-align:left}
.team .big{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.team .mem{display:flex;gap:6px;flex-wrap:wrap}
.team .mem span{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:999px;color:#fff}
.team .mem .nobody{background:transparent;color:var(--ink-dim);padding:0;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:500}
.team .adj{display:flex;gap:4px}
.team .adj button{width:28px;height:24px;border-radius:6px;border:1px solid rgba(255,255,255,.15);font-weight:700;font-size:13px;background:rgba(255,255,255,.06)}
.team.bump{transform:scale(1.04)}
.team .delta{position:absolute;right:12px;top:-14px;font-family:var(--f-mono);font-weight:700;font-size:15px;padding:1px 8px;border-radius:6px;background:var(--night);opacity:0;transition:opacity .2s,transform .6s}
.team .delta.show{opacity:1;transform:translateY(-6px)}
.jokers{display:flex;gap:5px;flex-wrap:wrap}
.jk{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06)}
.jk.used{opacity:.3;text-decoration:line-through}
.jk.active{background:var(--gold);color:#1d1600;border-color:var(--gold)}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(4,7,22,.62);backdrop-filter:blur(3px)}
.card{width:min(860px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,rgba(40,80,170,.97),rgba(22,48,112,.97));border:2px solid #5a86f0;border-radius:16px;padding:clamp(16px,2.6vw,28px);display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(60,110,240,.25);animation:zoom .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes zoom{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:6px;background:rgba(7,11,31,.65);border:1px solid #3a5bb0}
.chip.pts{border-color:var(--gold);color:var(--gold);display:inline-flex;gap:4px;align-items:center}
.chip.pts svg{width:12px;height:12px}
.qtext{margin:0;text-align:center;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(22px,3.4vw,38px);line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.secret{border:1px dashed var(--gold);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--gold);background:rgba(7,11,31,.4)}
.secret b{color:#fff}
.hintbox{text-align:center;font-weight:600;color:var(--gold);font-size:17px}
.buzzstate{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:14px;border-radius:12px;background:rgba(7,11,31,.55);border:2px solid rgba(255,255,255,.15);font-family:var(--f-display);font-weight:800;font-size:clamp(18px,2.4vw,26px);text-transform:uppercase;letter-spacing:.04em;text-align:center}
.buzzstate.hot{border-color:var(--bolt);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(232,52,78,.6)}}
.buzzstate i{width:18px;height:18px;border-radius:50%}
.answer{text-align:center;border-radius:12px;padding:14px;border:2px solid var(--good);background:rgba(47,191,113,.18);font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2.8vw,30px);text-transform:uppercase;letter-spacing:.04em;animation:pop .45s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.locked{font-size:13px;color:var(--ink-dim);text-align:center}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.keys{font-size:12px;color:#b9c6f5;display:flex;gap:10px;flex-wrap:wrap}
.jrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.jteam{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 10px;border-radius:10px;border:2px solid;background:rgba(7,11,31,.4)}
.jteam b{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:14px;margin-right:auto}
.jteam button.jk:not(:disabled):hover{border-color:var(--gold)}

.final{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;padding:16px 0}
.final h2{margin:0;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:clamp(34px,6vw,64px);text-transform:uppercase;line-height:1;text-wrap:balance}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;width:100%;max-width:620px}
.pod{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.pod .n{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;overflow-wrap:anywhere}
.pod .s{font-family:var(--f-mono);color:var(--ink-dim)}
.pod .blk{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:40px;color:#fff}
.pod.p1 .blk{height:170px}.pod.p2 .blk{height:120px}.pod.p3 .blk{height:85px}
.r2 h2{color:var(--gold);text-shadow:0 0 30px rgba(245,197,66,.4)}

/* Spieler */
.player{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;border:3px solid;background:rgba(7,11,31,.6)}
.pbar .who{font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em;overflow-wrap:anywhere}
.pbar .who small{display:block;font-size:13px;color:var(--ink-dim);letter-spacing:.06em}
.pbar .sc{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:34px;font-variant-numeric:tabular-nums}
.pq{background:linear-gradient(180deg,rgba(40,80,170,.95),rgba(22,48,112,.95));border:2px solid #5a86f0;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.pq .qtext{font-size:clamp(20px,5.6vw,30px)}
.bigbuzz{align-self:center;width:min(260px,70vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#ff7d8d,var(--bolt) 55%,#a3122a);border:6px solid #ff9aa8;box-shadow:0 12px 0 #6e0b1c,0 20px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:clamp(40px,12vw,64px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s,filter .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bigbuzz svg{width:34px;height:34px}
.bigbuzz:active:not(:disabled){transform:translateY(10px);box-shadow:0 2px 0 #6e0b1c,0 8px 20px rgba(0,0,0,.5)}
.bigbuzz:disabled{filter:grayscale(1) brightness(.55);cursor:not-allowed}
.bigbuzz.me{filter:none;background:radial-gradient(circle at 38% 32%,#7dffb4,var(--good) 55%,#147a43);border-color:#a5ffcc;box-shadow:0 12px 0 #0b4a28;font-size:clamp(26px,8vw,40px)}
.pstatus{text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(18px,5vw,24px);text-transform:uppercase;letter-spacing:.04em;min-height:1.2em}
.wait{text-align:center;padding:30px 16px;border:2px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.wait b{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.mini div{border:2px solid;border-radius:10px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px;font-weight:700}
.mini span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pjokers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pjokers button{padding:10px 6px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(7,11,31,.5);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:13px}
.pjokers button span{font-size:22px}
.pjokers button:disabled{opacity:.3}
.pjokers button.active{border-color:var(--gold);background:rgba(245,197,66,.18);opacity:1}
.join{display:flex;flex-direction:column;gap:14px}
.teampick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.teampick button{padding:14px 10px;border-radius:12px;border:3px solid;background:rgba(7,11,31,.5);font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;overflow-wrap:anywhere}
.teampick button[aria-pressed="true"]{color:#fff}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--gold);color:#1d1600;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Kategorien-Auswahl */
.pickbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pk{font-family:var(--f-display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:4px 12px;border-radius:999px;border:2px solid}
.pk.r1{border-color:var(--gold);color:var(--gold)}
.pk.r2{border-color:#c46cf0;color:#d9a3f7}
.pk.warn{opacity:.55}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}

    el("button",{class:"btn small danger",text:"Alle Beispielfragen zurücksetzen",onclick:(ev)=>{const b=ev.currentTarget;if(!b.dataset.arm){b.dataset.arm="1";b.textContent="Sicher? Eigene Änderungen gehen verloren";setTimeout(()=>{delete b.dataset.arm;b.textContent="Alle Beispielfragen zurücksetzen";},3000);return;}
      const own=S.pool.filter(c=>c.custom);S.pool=clone(POOL).concat(own);S.pick=clone(DEFPICK);editing=null;save();renderSetupInto();toast("Beispielfragen zurückgesetzt");}}),
    el("button",{class:"btn primary",text:"Neues Spiel starten",disabled:!ok,title:ok?"":"Wähle pro Runde mindestens 2 Kategorien",onclick:()=>{newGame();view="game";syncTabs();hostRender();broadcast();}})));
}

/* ================== SPIELER ================== */
let P={name:"",team:null,joined:false},PS=null,psTab=null,psEpoch=0,localDeadline=0,pTick=null;
try{const d=JSON.parse(localStorage.getItem(KEY+"-me")||"null");if(d){P.name=d.name||"";P.team=d.team;}}catch(e){}
function saveMe(){try{localStorage.setItem(KEY+"-me",JSON.stringify({name:P.name,team:P.team}));}catch(e){}}
function onState(d){
  if(!d||typeof d!=="object"||role!=="player")return;
  if(psTab===d.tab&&d.e<psEpoch)return;
  const prevQ=PS&&PS.q,prevBz=prevQ&&prevQ.bz;
  psTab=d.tab;psEpoch=d.e;PS=d;
  if(d.q&&d.q.tl!=null)localDeadline=Date.now()+d.q.tl*1000;

function playerRender(){
  const m=$("main");m.replaceChildren();$("overlaySlot").replaceChildren();
  const w=el("div",{class:"player"});m.append(w);
  if(!online){w.append(el("div",{class:"wait"},el("b",{text:"Verbinde mit dem Quiz …"}),el("p",{class:"hint",text:"Code: "+code+". Falls das länger dauert: Prüfe, ob der Code stimmt und ob der Host das Quiz offen hat."})));return;}
  if(!PS){w.append(el("div",{class:"wait"},el("b",{text:"Warte auf den Host …"}),el("p",{class:"hint",text:"Sobald der Host das Quiz offen hat, geht es hier los."})));return;}
  if(!P.joined||P.team==null||P.team>=PS.teams.length)return renderJoin(w);
  const t=P.team,c=TEAMCOL[t],team=PS.teams[t];
  w.append(el("div",{class:"pbar",style:"border-color:"+c},el("div",{class:"who"},P.name,el("small",{text:team.n})),el("div",{class:"sc",text:String(team.s)})));
  if(PS.ph==="final"){w.append(el("div",{class:"pq"},finalEl(PS.teams)));return;}
  if(PS.ph==="interlude"){w.append(el("div",{class:"wait"},el("span",{class:"round",text:"Runde 1 geschafft"}),el("b",{style:"color:var(--gold)",text:"Gleich kommt Runde 2 mit doppelten Punkten!"})),miniScores());return;}
  if(PS.ph!=="q"||!PS.q){
    const tt=PS.teams[PS.turn];
    w.append(el("div",{class:"wait"},el("span",{class:"round",text:PS.rd===1?"Runde 1":"Runde 2 · doppelte Punkte"}),el("b",{text:"Warte auf die nächste Frage"}),
      el("span",{class:"turn",style:"border-color:"+TEAMCOL[PS.turn]},el("i",{style:"background:"+TEAMCOL[PS.turn]+";color:"+TEAMCOL[PS.turn]}),(tt?tt.n:"Team")+" wählt")));
    w.append(miniScores());w.append(pJokers(false));return;
  }
  const q=PS.q,locked=q.lk.includes(t),meBz=q.bz&&q.bz.peer&&myPeer&&q.bz.peer===myPeer;
  const card=el("div",{class:"pq"},el("div",{class:"card-head"},el("span",{class:"chip",text:"# "+q.c}),el("div",{class:"row"},q.tot?clockEl():null,el("span",{class:"chip pts"},q.p+" Pkt. ",bolt()))),el("h1",{class:"qtext",text:q.t}));
  if(q.h)card.append(el("div",{class:"hintbox",text:"💡 "+q.h}));
  if(q.rev)card.append(el("div",{class:"answer",text:q.a||"–"}));
  w.append(card);
  let status="",dis=true,cls="bigbuzz";
  if(q.rev){status=q.bz?"":"Aufgelöst";}
  else if(meBz){status="Du bist dran! Sag deine Antwort laut.";cls+=" me";}
  else if(q.bz){status=q.bz.n+" ("+(PS.teams[q.bz.t]?.n||"")+") antwortet …";}
  else if(locked){status="Dein Team ist bei dieser Frage raus";}
  else if(q.open){status="Weißt du's? Drück den Buzzer!";dis=false;}
  else status="Buzzer geschlossen";
  const btn=el("button",{class:cls,id:"buzz",disabled:dis&&!meBz,"aria-label":"Buzzer"},bolt(),meBz?"DU!":"BUZZ");
  if(meBz)btn.disabled=true;
  btn.onclick=()=>{if(btn.disabled)return;if(!sendHost({type:"buzz"}))toast("Keine Verbindung zum Host");btn.disabled=true;sound("buzz");if(navigator.vibrate)try{navigator.vibrate(80);}catch(e){}};
  w.append(btn,el("div",{class:"pstatus",style:meBz?"color:var(--good)":"",text:status}));
  w.append(pJokers(!q.rev));
  w.append(miniScores());
  if(q.tot)paintPlayerClock();
}
function paintPlayerClock(){
  clearInterval(pTick);const q=PS&&PS.q;if(!q||!q.tot)return;
  const draw=()=>{const left=q.run?Math.max(0,(localDeadline-Date.now())/1000):q.tl;document.querySelectorAll(".clock").forEach(n=>paintClock(n,left,q.tot));};
  draw();if(q.run)pTick=setInterval(draw,200);
}
function miniScores(){return el("div",{class:"mini"},...PS.teams.map((t,i)=>el("div",{style:"border-color:"+TEAMCOL[i]},el("span",{text:t.n}),el("b",{text:String(t.s)}))));}
function pJokers(usable){
  const t=P.team,team=PS.teams[t],q=PS.q;
  return el("div",null,el("p",{class:"hint",style:"margin-bottom:6px",text:usable?"Eure Joker (jeder nur einmal pro Spiel):":"Eure Joker – nutzbar, sobald eine Frage läuft:"}),
    el("div",{class:"pjokers"},...JOKERS.map((J,k)=>{const active=q&&((J.k==="double"&&q.dbl.includes(t))||(J.k==="shield"&&q.sh.includes(t)));
      const b=el("button",{class:active?"active":"",disabled:!usable||!team.j[k]||active,title:J.desc},el("span",{text:J.icon}),J.name);
      b.onclick=()=>{if(!sendHost({type:"joker",k:J.k})){toast("Keine Verbindung zum Host");return;}b.disabled=true;toast(J.name+"-Joker eingesetzt");};return b;})));
}
function renderJoin(w){
  const name=el("input",{id:"pname",maxlength:"20",placeholder:"Dein Name",value:P.name});
  const pick=el("div",{class:"teampick"});
  const draw=()=>{pick.replaceChildren(...PS.teams.map((t,i)=>{const on=P.team===i;return el("button",{"aria-pressed":String(on),style:"border-color:"+TEAMCOL[i]+(on?";background:"+TEAMCOL[i]:""),text:t.n,onclick:()=>{P.team=i;draw();}});}));};
  draw();
  w.append(el("div",{class:"box join"},el("h2",{text:"Mitspielen"}),el("label",null,"Name",name),el("div",null,el("p",{class:"hint",style:"margin-bottom:6px",text:"Wähle dein Team"}),pick),
    el("button",{class:"btn primary",text:"Beitreten",onclick:()=>{P.name=name.value.trim().slice(0,20);if(!P.name){toast("Bitte gib deinen Namen ein");return;}if(P.team==null||P.team>=PS.teams.length){toast("Bitte wähle ein Team");return;}
      P.joined=true;saveMe();sendHello();playerRender();}})));
  w.append(el("p",{class:"hint",style:"text-align:center",text:"Du antwortest per Sprache im Discord-Call. Hier drückst du nur den Buzzer."}));

/* ================== Verbindung (PeerJS) ================== */
function sendHost(m){try{if(hostConn&&hostConn.open){hostConn.send(m);return true;}}catch(e){}return false;}
function sendHello(){if(P.joined)sendHost({type:"hello",name:P.name,team:P.team});}
function joinLink(){return location.href.split(/[?#]/)[0]+"?code="+code;}
function copyLink(){const l=joinLink();if(navigator.clipboard)navigator.clipboard.writeText(l).then(()=>toast("Link kopiert – schick ihn in Discord"),()=>prompt("Link kopieren:",l));else prompt("Link kopieren:",l);}
function makeCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<5;i++)c+=a[Math.floor(Math.random()*a.length)];return c;}

function startHost(c){
  code=c;try{localStorage.setItem(KEY+"-hostcode",code);}catch(e){}
  role="host";view="game";syncTabs();hostRender();setLive(false,"Starte Raum …");
  if(peer){try{peer.destroy();}catch(e){}}
  conns.clear();
  peer=new Peer(PREFIX+code,{debug:0});
  peer.on("open",()=>{online=true;setLive(true,"Live · Code "+code);hostRender();});
  peer.on("connection",conn=>{
    conn.on("open",()=>{conns.set(conn.peer,{conn,name:null,team:null});try{conn.send(pub());}catch(e){}});
    conn.on("data",d=>hostData(conn,d));
    conn.on("close",()=>{conns.delete(conn.peer);refreshPlayers();});
    conn.on("error",()=>{conns.delete(conn.peer);refreshPlayers();});
  });
  peer.on("disconnected",()=>{setLive(false,"Verbindung weg – verbinde neu …");try{peer.reconnect();}catch(e){}});
  peer.on("error",e=>{
    if(e.type==="unavailable-id"){setLive(false,"Raum wird noch freigegeben …");setTimeout(()=>startHost(code),4000);}
    else if(e.type==="network"||e.type==="server-error"||e.type==="socket-error"){setLive(false,"Keine Verbindung zum Server – versuche erneut …");setTimeout(()=>{try{peer.reconnect();}catch(x){startHost(code);}},4000);}
  });
}
function refreshPlayers(){
  if(role!=="host")return;
  const n=[...conns.values()].filter(p=>p.name).length;
  if(online)setLive(true,"Live · Code "+code+" · "+n+" Spieler");
  if(view==="game"){const tb=document.querySelector(".teams");if(tb)tb.replaceWith(teamsEl());}
}
function hostData(conn,d){
  if(!d||typeof d!=="object")return;
  const p=conns.get(conn.peer);if(!p)return;
  if(d.type==="hello"){const t=Number(d.team);p.name=String(d.name||"Spieler").replace(/[<>]/g,"").slice(0,20);p.team=(t>=0&&t<S.teams.length)?t:null;refreshPlayers();try{conn.send(pub());}catch(e){}}
  else if(d.type==="buzz")onBuzz(conn.peer);
  else if(d.type==="joker")onJoker(conn.peer,d.k);
}

function startPlayer(c){
  code=c;role="player";syncTabs();online=false;playerRender();setLive(false,"Verbinde …");
  peer=new Peer({debug:0});
  peer.on("open",id=>{myPeer=id;connectHost();});
  peer.on("disconnected",()=>{try{peer.reconnect();}catch(e){}});
  peer.on("error",e=>{
    if(e.type==="peer-unavailable"){online=false;setLive(false,"Kein Quiz mit Code "+code+" gefunden");playerRender();setTimeout(connectHost,4000);}
    else if(e.type==="network"||e.type==="server-error"||e.type==="socket-error"){setLive(false,"Keine Verbindung – versuche erneut …");}
  });
}
let reconnectT=null;
function connectHost(){
  clearTimeout(reconnectT);
  if(!peer||peer.destroyed)return;
  if(peer.disconnected){try{peer.reconnect();}catch(e){}reconnectT=setTimeout(connectHost,3000);return;}
  const conn=peer.connect(PREFIX+code,{reliable:true});hostConn=conn;
  conn.on("open",()=>{online=true;setLive(true,"Live · Code "+code);sendHello();});
  conn.on("data",onState);
  conn.on("close",()=>{if(hostConn!==conn)return;online=false;setLive(false,"Verbindung weg – verbinde neu …");playerRender();reconnectT=setTimeout(connectHost,2500);});
  conn.on("error",()=>{});
}

/* ================== Startseite ================== */

  role=null;syncTabs();setLive(false,"Nicht verbunden");
  const m=$("main");m.replaceChildren();
  let saved=null;try{saved=localStorage.getItem(KEY+"-hostcode");}catch(e){}
  const codeIn=el("input",{id:"joinCode",maxlength:"5",placeholder:"z. B. K7QM2",style:"text-transform:uppercase;font-family:var(--f-mono);font-size:20px;letter-spacing:.2em;text-align:center"});
  const go=()=>{const c=codeIn.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");if(c.length<4){toast("Bitte gib den Code vom Host ein");return;}location.search="?code="+c;};
  codeIn.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  m.append(el("div",{class:"player"},
    el("div",{class:"box"},el("h2",{text:"Quiz hosten"}),el("p",{class:"hint",text:"Du stellst die Fragen und entscheidest, ob eine Antwort richtig ist. Du bekommst einen Code für deine Freunde."}),
      el("div",{class:"row"},el("button",{class:"btn primary",text:saved?"Neuen Raum starten":"Raum starten",onclick:()=>startHost(makeCode())}),saved?el("button",{class:"btn",text:"Weiter mit Raum "+saved,onclick:()=>startHost(saved)}):null)),
    el("div",{class:"box"},el("h2",{text:"Mitspielen"}),el("p",{class:"hint",text:"Gib den Code ein, den dir der Host geschickt hat."}),codeIn,el("button",{class:"btn primary",text:"Beitreten",onclick:go}))));
}

/* ================== Tabs + Tasten ================== */
function syncTabs(){
  $("tabs").hidden=role!=="host";
  $("tabSetup").setAttribute("aria-pressed",String(view==="setup"));
  $("tabGame").setAttribute("aria-pressed",String(view==="game"));
}
$("tabSetup").onclick=()=>{view="setup";syncTabs();hostRender();};

document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select"))return;
  if(role==="player"){if(e.code==="Space"){const b=$("buzz");if(b&&!b.disabled){e.preventDefault();b.click();}}return;}
  if(role!=="host"||G.phase!=="q")return;
  if(e.key==="r"||e.key==="R"){e.preventDefault();judge(true);}
  else if(e.key==="f"||e.key==="F"){e.preventDefault();judge(false);}
  else if(e.code==="Space"){e.preventDefault();revealQ();}
  else if(e.key==="Enter"){e.preventDefault();finishQ();}
});
setInterval(()=>{if(role==="host"&&Date.now()-lastSend>2500)broadcast();},1000);

/* ================== Start ================== */
if(typeof Peer==="undefined"){
  $("main").append(el("div",{class:"wait"},el("b",{text:"Verbindungs-Baustein fehlt"}),el("p",{class:"hint",text:"Die Seite braucht Internet, um den Verbindungs-Baustein (PeerJS) zu laden. Prüfe deine Verbindung und lade neu."})));
}else{
  const c=(new URLSearchParams(location.search).get("code")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
